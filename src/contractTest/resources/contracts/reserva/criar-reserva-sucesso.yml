name: criar-reserva-sucesso
description: "Deve criar uma reserva com sucesso e retornar 201 Created"
request:
  method: POST
  url: /api/v1/reservas
  headers:
    Content-Type: application/json
  body:
    loteId: "11111111-1111-1111-1111-111111111111"
    usuarioId: "22222222-2222-2222-2222-222222222222"
  matchers:
    body:
      - path: $.loteId
        type: by_regex
        value: "[a-f0-9\\-]{36}"
      - path: $.usuarioId
        type: by_regex
        value: "[a-f0-9\\-]{36}"
response:
  status: 201
  headers:
    Content-Type: application/json
  body:
    id: "33333333-3333-3333-3333-333333333333"
    usuarioId: "22222222-2222-2222-2222-222222222222"
    ingressoId: "44444444-4444-4444-4444-444444444444"
    status: "PENDENTE"
    dataCriacao: "2026-09-12T07:45:00"
    dataExpiracao: "2026-09-12T07:55:00"
  matchers:
    body:
      - path: $.id
        type: by_regex
        value: "[a-f0-9\\-]{36}"
      - path: $.usuarioId
        type: by_regex
        value: "[a-f0-9\\-]{36}"
      - path: $.ingressoId
        type: by_regex
        value: "[a-f0-9\\-]{36}"
      - path: $.status
        type: by_regex
        value: "PENDENTE"
